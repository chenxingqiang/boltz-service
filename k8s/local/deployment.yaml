apiVersion: apps/v1
kind: Deployment
metadata:
  name: boltz-service
  namespace: boltz
  labels:
    app: boltz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boltz
  template:
    metadata:
      labels:
        app: boltz
    spec:
      initContainers:
      - name: bootstrap-model
        image: boltz-service:local
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/bootstrap-model.sh"]
        envFrom:
        - configMapRef:
            name: boltz-config
        volumeMounts:
        - name: cache-volume
          mountPath: /data/cache
      containers:
      - name: boltz
        image: boltz-service:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: grpc
          containerPort: 50051
        envFrom:
        - configMapRef:
            name: boltz-config
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "6"
            memory: 14Gi
        volumeMounts:
        - name: cache-volume
          mountPath: /data/cache
        readinessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 60
          periodSeconds: 20
      volumes:
      - name: cache-volume
        emptyDir: {}
